plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.2.20'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'com.diffplug.spotless' version '7.0.4'
}

group 'fi.hsl'
version '2.1.0'

java {
    // Compile with JDK 25 (required to read transitdata-common 3.2.0, which is Java 25 bytecode)
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Kotlin does not support a JVM 25 target yet, so emit JVM 24 bytecode for both Java and
// Kotlin. It still runs on the Java 25 runtime image.
tasks.withType(JavaCompile).configureEach {
    options.release = 24
}
compileKotlin {
    kotlinOptions.jvmTarget = "24"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "24"
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "https://maven.pkg.github.com/HSLdevcom/*"
        credentials {
            username = project.findProperty("github.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("github.token") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

spotless {
    kotlin {
        ktfmt('0.54').kotlinlangStyle()
    }

    kotlinGradle {
        ktfmt('0.54').kotlinlangStyle()
    }
}

shadowJar {
    archiveFileName = "transitdata-eke-sink.jar"
}

jar {
    manifest {
        attributes(
                'Main-Class': 'fi.hsl.transitdata.eke_sink.MainKt',
                'Implementation-Version': project.version
        )
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "com.azure:azure-identity:1.13.3"
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.17.2'

    implementation "io.github.microutils:kotlin-logging:1.6.22"

    implementation('fi.hsl:transitdata-common:3.2.0') {
        exclude group: 'javax.xml.bind', module: 'activation'
        exclude group: 'com.google.guava', module: 'guava'
    }
    //Needed for Pulsar
    implementation 'jaxb:activation:1.0.2'

    implementation "com.azure:azure-storage-blob:12.13.0"
    implementation "io.netty:netty-tcnative-boringssl-static:2.0.39.Final"

    implementation 'org.apache.commons:commons-csv:1.9.0'
    implementation "org.apache.commons:commons-compress:1.21"
    implementation "commons-codec:commons-codec:1.15"

    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.4.0"
    // Pin mockito-core to a ByteBuddy that can instrument on the Java 25 runtime
    testImplementation "org.mockito:mockito-core:5.23.0"
}

test {
    useJUnit()
}
